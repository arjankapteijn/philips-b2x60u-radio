# /etc/wireplumber/wireplumber.conf.d/radio.conf - leave the sound cards alone
#
# The only sinks are "radio" and "dac" from /etc/pipewire/pipewire.conf.d/radio.conf.
# Without this, WirePlumber would also make a stereo sink for the HiFiBerry
# (skipping the mono mix), one for HDMI, and devices for the cameras the radio
# doesn't have.

wireplumber.profiles = {
    main = {
        monitor.alsa      = disabled
        monitor.v4l2      = disabled
        monitor.libcamera = disabled
    }
}
