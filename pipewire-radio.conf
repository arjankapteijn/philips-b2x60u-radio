# /etc/pipewire/pipewire.conf.d/radio.conf - the radio's audio, all in PipeWire
#
#   Soloist -> "radio" (mono sink, mixes (L+R)/2) -> "dac" (HiFiBerry, both channels)
#
# One speaker on a stereo amp, so everything is played in mono on both
# channels. Volume is Soloist's own; there is no ALSA configuration.
# WirePlumber's card detection is off (wireplumber-radio.conf), so these two
# are the only sinks. PipeWire releases the DAC a few seconds after playback
# stops.

context.properties = {
    # The DAC runs at 44.1 kHz, the rate Spotify streams at: no resampling
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]
}

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = "dac"
            node.description = "HiFiBerry DAC"
            media.class      = "Audio/Sink"
            api.alsa.path    = "hw:CARD=sndrpihifiberry,DEV=0"
            audio.rate       = 44100
            audio.channels   = 2
            audio.position   = [ FL FR ]
            priority.session = 100
        }
        # The sink opens the DAC once to read its formats; if that fails
        # (device busy), start PipeWire anyway, just without this sink
        flags = [ nofail ]
    }
]

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Philips B2X60U"
            capture.props = {
                node.name        = "radio"
                media.class      = "Audio/Sink"
                audio.position   = [ MONO ]
                priority.session = 1000
            }
            playback.props = {
                node.name     = "radio.output"
                target.object = "dac"
                audio.position = [ MONO ]
                # Don't keep the DAC running while nothing plays
                node.passive  = true
            }
        }
    }
]
