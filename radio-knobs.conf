# /etc/radio-knobs.conf - settings for radio-knobs (BCM pin numbers)

# Left knob: volume, push = play/pause, hold = shut down.
# Move the push button to GPIO3 (physical pin 5) to also switch the Pi back on.
LEFT_A=14
LEFT_B=15
LEFT_BUTTON=4

# Right knob: previous/next track, push = next favourite, hold = add favourite
RIGHT_A=23
RIGHT_B=24
RIGHT_BUTTON=17

LED=26

# Swap if a knob turns the wrong way
LEFT_INVERT=yes
RIGHT_INVERT=yes

# 4 = one click per full quadrature cycle (the PEC11 encoders in this radio), 2 = half cycle
TRANSITIONS_PER_DETENT=4
# Spotify volume steps (of 100) per click of the left knob
VOLUME_STEP=4
# Seconds to hold a button for the long-press action
HOLD_TIME=3
